spring.application.name=calcul-service
server.port=8081

# Serveur de configuration : interroge au demarrage, avant tout le reste.
# optional: -> si le serveur est injoignable, le demarrage continue sans lui
spring.config.import=optional:configserver:http://localhost:9999

# Adresse de l'annuaire Eureka. Les autres reglages Eureka (instance-id,
# prefer-ip-address, delais...) viennent maintenant du depot de configuration.
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# Actuator : points exposes en HTTP (refresh pour la partie E)
management.endpoints.web.exposure.include=health,env,refresh
# /actuator/env affiche les valeurs (masquees par defaut)
management.endpoint.env.show-values=always
# Afficher les points Actuator dans Swagger UI
springdoc.show-actuator=true

# Conserve du TP4
springdoc.cache.disabled=true

# Un /actuator/refresh ne doit pas detruire le client Eureka (sinon le service
# est desinscrit puis ne se reenregistre pas : 400 au renouvellement du bail)
eureka.client.refresh.enable=false

# ---- Serveur gRPC (Spring gRPC) ----
# Port du serveur gRPC (Netty), distinct du port HTTP (Tomcat). Defaut : 9090.
# Propre a chaque instance, comme server.port : reste local (TP5, A.2)
spring.grpc.server.port=9091

# Le port gRPC publie dans Eureka (metadonnee grpc.port) vient du Config Server
# (calcul-service.properties du depot de configuration)
