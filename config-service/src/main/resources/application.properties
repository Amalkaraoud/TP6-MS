spring.application.name=config-service
server.port=9999

# Depot Git contenant les fichiers de configuration (partie B).
# Chemin ABSOLU, prefixe file:///, separateurs / meme sous Windows.
# Le chemin ne doit contenir ni espace ni accent. La variable d'environnement
# CONFIG_REPO_URI, si elle existe, remplace la valeur par defaut.
spring.cloud.config.server.git.uri=${CONFIG_REPO_URI:file:///C:/tp5-config/calculatrice-config-repo}

# Adresse de l'annuaire Eureka : le serveur de configuration s'y inscrit
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.instance-id=${spring.application.name}:${server.port}
eureka.instance.prefer-ip-address=true

# Actuator : etat du serveur sur /actuator/health
management.endpoints.web.exposure.include=health
